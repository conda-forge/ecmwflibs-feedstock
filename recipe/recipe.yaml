schema_version: 1

context:
  name: ecmwflibs
  version: "0.6.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ecmwf/ecmwflibs/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5e1e5a665cae9a94d846f7035253ddeb4b15bbb4d2e46cc91ed6975331f4d7bd
  patches:
    - find_conda_libs.diff

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - eccodes
    - magics
  run:
    - python
    - findlibs
    - ${{ pin_compatible('eccodes', upper_bound='x.x') }}
    - ${{ pin_compatible('magics', upper_bound='x.x') }}

tests:
  - python:
      imports:
        - ecmwflibs
      pip_check: true

about:
  summary: Wraps ECMWF tools (experimental)
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE.md
  homepage: https://github.com/ecmwf/ecmwflibs

extra:
  recipe-maintainers:
    - isuruf
    - timkpaine
